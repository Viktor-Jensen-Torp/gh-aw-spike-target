name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  # The queue's temporary branch, where this change is tested against the ones
  # ahead of it. This is the one required check with real work to do here: it is
  # what catches two changes that are each correct alone and broken together.
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # One definition of the checks, shared with the agents' pre-push hook
      # (.github/scripts/verify.sh). Never inline the command here.
      - run: bash .github/scripts/verify.sh --only test
