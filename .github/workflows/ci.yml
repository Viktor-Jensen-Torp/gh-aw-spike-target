name: CI

on:
  pull_request:
  push:
    branches: [main, develop]
  # The queue's temporary branch, where this change is tested against the ones
  # ahead of it. This is the one required check with real work to do here: it is
  # what catches two changes that are each correct alone and broken together.
  merge_group:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
      # One definition of the checks, shared with the agents' pre-push hook
      # (.github/scripts/verify.sh). Never inline the command here.
      - run: bash .github/scripts/verify.sh --only test

  # ESLint + Prettier (.github/lint/). A separate job so a lint failure shows as
  # its own required check (`lint`), not as a test failure. Runs on merge_group
  # like `test`, because every required check must report on the queue branch.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # npm's download cache, keyed on the lockfile, so `npm ci` in verify.sh
      # installs from cache. setup-node's cache fails without a lockfile, and
      # main has none until a release brings it, hence the two variants.
      - uses: actions/setup-node@v5
        if: hashFiles('package-lock.json') != ''
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-node@v5
        if: hashFiles('package-lock.json') == ''
        with:
          node-version: '24'
      - run: bash .github/scripts/verify.sh --only lint
