name: Merge group review

# Reports the `Agent review` check on a merge group, and nothing else.
#
# This exists because of a hard constraint, not a design preference. A merge
# queue requires EVERY required status check to report on its temporary branch;
# there is no way to mark a check pull-request-only (checked against the
# ruleset API — `required_status_checks` has only `context` and
# `integration_id`). And `Agent review` is a check run the reviewer App posts
# against a PULL REQUEST's head commit. A merge group is a different commit the
# reviewer never sees, so that context would never report and every queue entry
# would sit until `check_response_timeout_minutes` expired and was ejected.
#
# So this passes trivially, and the honest statement of what that means: the
# reviewer's verdict is enforced when the pull request ENTERS the queue — a
# pull request cannot be queued until its own required checks are green — and
# is not re-derived for the batch. A merge group can contain several pull
# requests, and "this pull request's verdict" does not map onto a combination
# of them; re-deriving it would mean looking each one up and re-posting a
# stored verdict.
#
# This is a vacuous gate, which FINDINGS warns about ("an absent gate is
# visible and a vacuous one is not"). It is written down here so it is visible.

on:
  merge_group:

permissions:
  contents: read

jobs:
  agent_review:
    # The name must match the required check exactly; rulesets match by name.
    name: Agent review
    runs-on: ubuntu-latest
    steps:
      - name: The verdict was enforced at the queue door
        run: |
          echo "A pull request cannot enter the merge queue until its own"
          echo "required checks are green, so every change in this group has"
          echo "already been judged by the reviewer on its own head commit."
          echo "This check reports so the entry is not ejected on a timeout."
