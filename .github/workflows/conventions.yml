name: Conventions

# Gives the conventions teeth. A rule that is only written down is a rule that
# gets ignored: the refiner disregarded a bolded, reasoned instruction three runs
# in a row (FINDINGS, 2026-09-22). Prose states the aim; this makes it true.
#
# Checks `.github/conventions/javascript.md`'s one rule that can be checked
# mechanically: a new helper does not go into the shared export line, because
# that line is what made two of three parallel changes collide.

# No `paths:` filter, deliberately. This is a REQUIRED check, and a required
# check that does not report leaves a pull request waiting forever — the
# silent-gate shape FINDINGS keeps running into. So it runs on every pull
# request and passes trivially when nothing was added to the shared file.
on:
  pull_request:
    branches: [develop]
  merge_group:

permissions:
  contents: read

jobs:
  conventions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: false }

      - name: Check the conventions
        env:
          BASE: ${{ github.event.pull_request.base.ref || 'develop' }}
        run: |
          set -euo pipefail

          # A merge group has no pull request to diff, and each change in it was
          # already checked on its own way in.
          if [ "${GITHUB_EVENT_NAME}" = "merge_group" ]; then
            echo "merge group: checked on each pull request"
            exit 0
          fi

          git fetch -q origin "$BASE"
          # The same script the implementer runs before it pushes, so the two
          # cannot drift apart.
          if bash .github/scripts/check-conventions.sh "origin/$BASE" \
               | tee "$GITHUB_STEP_SUMMARY"; then
            exit 0
          fi
          echo "::error::A convention was not met — see the job summary and .github/conventions/"
          exit 1
