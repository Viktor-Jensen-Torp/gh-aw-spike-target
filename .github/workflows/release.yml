name: Release

# Opens the daily release pull request, develop -> main, and nothing else.
#
# Deterministic on purpose: which commits are ahead of `main` is a fact. The
# judgement — what this release does as a whole, and where its parts meet — is
# release-review.md, and the decision to ship is a person's.
#
# The pull request is opened with the reviewer App, not GITHUB_TOKEN. A pull
# request opened by GITHUB_TOKEN triggers no workflows, so release-review.md
# would never run on it and the developer would arrive to an unread release.

# Manual only, deliberately. A release is a decision about what ships and when,
# and that decision is the owner's — a schedule would keep making it for them.
# On 2026-09-23 the cron opened PR #43 unasked, which is exactly the behaviour
# this removes. Run it from the Actions tab, or:
#   gh workflow run release.yml --repo <owner>/<repo>
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  open-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app_token
        with:
          client-id: ${{ vars.REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      - name: Open or refresh the release pull request
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Count changes, not commits: squashed agent work with a `(#n)`
          # subject. Sync merges are bookkeeping. This is only right while each
          # release is merged with a merge commit: a squashed release leaves its
          # changes looking unshipped, and PR #59 re-listed five of them.
          SHIPPING=$(gh api "repos/$REPO/compare/main...develop" \
            --jq '.commits[]
                  | select((.parents | length) == 1)
                  | .commit.message | split("\n")[0]
                  | select(test("\\(#[0-9]+\\)$"))')
          AHEAD=$(printf '%s' "$SHIPPING" | grep -c . || true)
          echo "develop has $AHEAD change(s) not on main"

          if [ "$AHEAD" -eq 0 ]; then
            echo "Nothing to release." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          EXISTING=$(gh pr list --repo "$REPO" --base main --head develop --state open \
            --json number,url --jq '.[0] // empty')
          if [ -n "$EXISTING" ]; then
            URL=$(jq -r '.url' <<<"$EXISTING")
            # An open release pull request follows `develop` on its own; every
            # push re-fires release-review.md on the new head.
            echo "Release pull request already open: $URL ($AHEAD commit(s))" \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          # Carry the closing keywords up to the release.
          #
          # An agent pull request says "Fixes #n" in its body, but it targets
          # `develop`, and GitHub only creates the issue link — and only closes
          # the issue — for a pull request merged into the DEFAULT branch. So
          # that keyword never fires: after release 2026-09-22 (#21) shipped
          # PR #18, issue #17 was still open and GraphQL reported
          # `closingIssuesReferences: []` — the link had never existed at all.
          # Re-stating the keywords here is what closes those issues when a
          # person merges this pull request into `main`, which is the intended
          # model: an issue is resolved when it ships, not when it merges.
          CLOSES=""
          for P in $(printf '%s\n' "$SHIPPING" | grep -oE '\(#[0-9]+\)$' | tr -d '(#)' | sort -u); do
            for I in $(gh pr view "$P" --repo "$REPO" --json body --jq '.body' 2>/dev/null \
                       | grep -oiE '(fixes|closes|resolves) #[0-9]+' \
                       | grep -oE '[0-9]+'); do
              CLOSES="$CLOSES$I\n"
            done
          done
          CLOSES=$(printf "$CLOSES" | sort -un)

          {
            echo "$AHEAD change(s) from \`develop\`, each already reviewed and merged on its own."
            echo
            echo "## Shipping"
            echo
            # Only what actually shipped. A sync merge of `main` into `develop`
            # is bookkeeping, not a change, and nine of them in a row made the
            # first release's list unreadable. Squashed agent work always ends
            # with its pull request number, so that is the filter.
            printf '%s\n' "$SHIPPING" | sed 's/^/- /'
            echo
            if [ -n "$CLOSES" ]; then
              echo "## Resolves"
              echo
              for I in $CLOSES; do echo "Closes #$I"; done
              echo
            fi
            echo "## How to handle this"
            echo
            echo "- **Ship it** — merge with a *merge commit*, not a squash, so each change keeps its \`(#n)\` and \`main\`'s history says what it shipped."
            echo "- **Ship it and file a follow-up** — merge, then open an issue."
            echo "- **Revert one change and ship the rest** — each change is a single squashed commit on \`develop\`, so GitHub's Revert button on that pull request is one click. Merge the revert into \`develop\` with your admin override; the agent reviewer cannot usefully judge a change whose purpose is removal. Then this pull request updates itself."
            echo
            echo "Do not cherry-pick a change out of this release: that ships a combination nothing has tested."
            echo
            echo "A release read from the reviewer will appear below shortly."
          } > /tmp/release-body.md

          URL=$(gh pr create --repo "$REPO" --base main --head develop \
            --title "Release $(date -u +%Y-%m-%d)" \
            --body-file /tmp/release-body.md)
          echo "Opened $URL ($AHEAD commit(s))" >> "$GITHUB_STEP_SUMMARY"
          echo "opened $URL"
