name: Pipeline tests

# Tests the pipeline's own scripts on the pull request that changes them, so a
# routing bug is caught before merge and not in a live run after (#136 found
# three that way). Agent behaviour is not covered: that still needs live runs.

on:
  pull_request:
    branches: [main, develop]
    paths:
      - ".github/scripts/**"
      - ".github/pi/**"
      - ".github/conventions/chain/requirements/**"
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read
  checks: read   # the check-run replays read a past commit's checks

jobs:
  pipeline-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { persist-credentials: false }
      - uses: actions/setup-node@v5
        with: { node-version: '24' }
      - name: Scripts (routing, check runs, conventions)
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/test/run.sh
      - name: Pi postconditions extension
        run: bash .github/pi/test/run.sh
      # gh-aw's own checks: compile plus the zizmor, actionlint and poutine
      # security linters. Fails on a High or Critical zizmor finding; the rest
      # is printed (pkg/cli/zizmor.go). Not --strict: it fails on every
      # finding, including the ~300 in gh-aw's own generated code. Not
      # `gh aw validate`: in v0.88.7 it skips every linter, since they are
      # gated on files being written (pkg/cli/compile_pipeline.go). The files
      # written here are discarded. zizmor and poutine run in Docker, which
      # the runner has. Pinned to the version the locks are compiled with.
      - name: Install gh-aw
        uses: github/gh-aw-actions/setup-cli@924af5fdc64061cfbf66fb584c8b07e2ac230c60 # v0.89.21
        with:
          version: v0.89.21
      - name: gh-aw security linters
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh aw compile --zizmor --actionlint --poutine --no-check-update
