name: Board status

# The board's Status column is a copy of where each issue is, one way only.
# The stage labels (and an open pull request, and closing) are the truth; this
# writes them into the project's Status field, because a board cannot make
# columns from labels. Nothing reads Status back, so the two cannot drift into
# disagreement: the next run corrects any hand-dragged card.
#
#   closed                      -> Done
#   merged                      -> Merged
#   an open PR fixes it         -> In progress
#   ready                       -> Ready
#   needs-split / needs-shape   -> Needs split / Needs shape
#   draft                       -> Draft
#   anything else               -> To refine
#
# Most label changes come from the pipeline itself with GITHUB_TOKEN, and those
# start no workflow. So this reconciles every item on a schedule, and also runs
# at once when a person changes an issue. It only writes a Status that differs.
#
# The reviewer App's token: GITHUB_TOKEN cannot reach Projects at all
# (gh-aw reference/auth-projects.mdx); the App has org Projects read/write.

on:
  schedule:
    - cron: "7,37 * * * *"
  issues:
    types: [opened, reopened, closed, labeled, unlabeled]
  workflow_dispatch:

concurrency:
  group: board-status
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@v3
        id: app_token
        with:
          client-id: ${{ vars.REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      - name: Copy each issue's stage into Status
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          REPO: ${{ github.repository }}
          PROJECT_NUMBER: "2"
          DRY_RUN: "false"
        run: |
          set -euo pipefail
          OWNER="${REPO%/*}"

          PROJECT=$(gh api graphql -F owner="$OWNER" -F n="$PROJECT_NUMBER" -f query='
            query($owner: String!, $n: Int!) { organization(login: $owner) { projectV2(number: $n) {
              id
              field(name: "Status") { ... on ProjectV2SingleSelectField { id options { id name } } } } } }' \
            --jq '.data.organization.projectV2')
          PID=$(jq -r '.id' <<<"$PROJECT"); FID=$(jq -r '.field.id' <<<"$PROJECT")

          # Every item: the issue behind it, its labels and state, and its Status now.
          ITEMS=$(gh api graphql --paginate -F owner="$OWNER" -F n="$PROJECT_NUMBER" -f query='
            query($owner: String!, $n: Int!, $endCursor: String) { organization(login: $owner) { projectV2(number: $n) {
              items(first: 100, after: $endCursor) {
                pageInfo { hasNextPage endCursor }
                nodes { id
                  status: fieldValueByName(name: "Status") { ... on ProjectV2ItemFieldSingleSelectValue { name } }
                  content { ... on Issue { number state repository { nameWithOwner }
                                           labels(first: 30) { nodes { name } } } } } } } } }' \
            --jq '.data.organization.projectV2.items.nodes[]
                  | select(.content.number != null)
                  | {item: .id, repo: .content.repository.nameWithOwner, number: .content.number,
                     state: .content.state, labels: [.content.labels.nodes[].name], status: (.status.name // "")}' \
            | jq -s '.')

          # Issues an open pull request says it fixes: those are in progress.
          IN_PROGRESS=$(gh pr list --repo "$REPO" --state open --limit 200 --json body --jq '.[].body // ""' \
            | { grep -oiE '(fixes|closes|resolves) #[0-9]+' | grep -oE '[0-9]+' || true; } | jq -R 'tonumber' | jq -sc 'unique')

          CHANGES=$(jq -c --arg repo "$REPO" --argjson wip "$IN_PROGRESS" '
            .[] | select(.repo == $repo)
            | . + {want: (
                if .state == "CLOSED" then "Done"
                elif (.labels | index("merged")) then "Merged"
                elif (.number as $n | $wip | index($n)) then "In progress"
                elif (.labels | index("ready")) then "Ready"
                elif (.labels | index("needs-split")) then "Needs split"
                elif (.labels | index("needs-shape")) then "Needs shape"
                elif (.labels | index("draft")) then "Draft"
                else "To refine" end)}
            | select(.want != .status)' <<<"$ITEMS")
          [ -n "$CHANGES" ] || { echo "Every card already shows its stage."; exit 0; }

          while read -r C; do
            N=$(jq -r '.number' <<<"$C"); WANT=$(jq -r '.want' <<<"$C")
            OPT=$(jq -r --arg w "$WANT" '.field.options[] | select(.name == $w) | .id' <<<"$PROJECT")
            [ -n "$OPT" ] || { echo "::warning::Status has no option '$WANT'"; continue; }
            if [ "$DRY_RUN" = "true" ]; then
              echo "would set #$N: '$(jq -r '.status' <<<"$C")' -> '$WANT'"; continue
            fi
            # -f, not -F: ids are strings, and -F turns a numeric-looking one into a number.
            gh api graphql -f p="$PID" -f i="$(jq -r '.item' <<<"$C")" -f f="$FID" -f o="$OPT" -f query='
              mutation($p: ID!, $i: ID!, $f: ID!, $o: String!) {
                updateProjectV2ItemFieldValue(input: {projectId: $p, itemId: $i, fieldId: $f,
                  value: {singleSelectOptionId: $o}}) { projectV2Item { id } } }' --silent
            echo "#$N: $(jq -r '.status // ""' <<<"$C" | sed 's/^$/(none)/') -> $WANT"
          done <<<"$CHANGES"
