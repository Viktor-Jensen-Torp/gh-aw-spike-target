name: Dispatcher

# Starts work, so the pipeline runs while nobody is watching. Deterministic: the
# order is decided here, not by an agent.
#
# Every 30 minutes, while fewer than MAX_OPEN agent pull requests are open (or
# being written), it dispatches implement for the next issues:
#   - in the current sprint: the open milestone with the earliest due date;
#   - `ready` (set by a person, after the refiner marked it `refined`), and not
#     an Epic or a Spike, and not labelled `human` (people do those themselves;
#     the assignee is who is responsible, not who works) or `paused` (a person
#     stopped it for now, without taking it out of the sprint);
#   - unblocked: every "blocked by" issue is closed, or `merged` (its code is
#     on develop already, so dependent work can build on it);
#   - not already being worked: no open pull request fixes it, no implement
#     run for it is in flight, and no `needs-human` on it;
#   - High, Medium, Low, then no priority; oldest first within each.
# People decide what is in the sprint and how much it matters; this only picks
# the next thing from what they decided.
#
# MAX_PER_DAY bounds the spend: dispatched runs skip gh-aw's daily AI-credit
# cap (check_daily_aic_workflow_guardrail.cjs), so this is the cap.
#
# It dispatches with GITHUB_TOKEN (.github/scripts/dispatch.sh): a dispatch,
# unlike a label, starts a workflow from that token. The reviewer App only
# reads (issue fields need it).

on:
  # As soon as something may have become startable or a slot may have freed:
  # an issue made ready, a link changed, a run finished, a pull request merged.
  # The schedule is only a backstop: GitHub delays and drops scheduled runs
  # (the 30-minute sweeper ran at 12:22, 16:37, 19:36 on 2026-09-26).
  workflow_run:
    workflows: [Refine, Relate, Implement, Merged]
    types: [completed]
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only say what would be started"
        type: boolean
        default: false

concurrency:
  group: dispatcher
  cancel-in-progress: false

permissions:
  contents: read
  actions: write   # dispatch implement

jobs:
  dispatch:
    # Every issue label change starts Implement, which then skips; those
    # completions change nothing.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion != 'skipped'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false
      - uses: actions/create-github-app-token@v3
        id: app_token
        with:
          client-id: ${{ vars.REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}

      - name: Start the next ready issues
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          ACTIONS_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MAX_OPEN: "2"
          MAX_PER_DAY: "10"
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          say() { echo "$1"; echo "$1" >> "$GITHUB_STEP_SUMMARY"; }

          SPRINT=$(gh api "repos/$REPO/milestones?state=open&sort=due_on&direction=asc" \
                     --jq '[.[] | select(.due_on != null)][0].title // ""')
          [ -n "$SPRINT" ] || { say "No current sprint (no open milestone with a due date); nothing to start."; exit 0; }

          # A run whose gate stopped it (agent job skipped) is not work; a run
          # still deciding counts as real, which errs towards starting less.
          runs() { GH_TOKEN="$ACTIONS_TOKEN" gh run list --repo "$REPO" --workflow implement.lock.yml --limit 100 \
                     --json databaseId,status,conclusion,displayTitle "$@"; }
          real() { GH_TOKEN="$ACTIONS_TOKEN" gh run view "$1" --repo "$REPO" --json jobs \
                     --jq '[.jobs[] | select(.name == "agent")] | (length == 0 or (.[0].conclusion != "skipped"))'; }
          count_real() { local n=0; for R in $(jq -r '.[] | select(.conclusion != "skipped") | .databaseId'); do
                           [ "$(real "$R")" = "true" ] && n=$((n + 1)); done; echo "$n"; }

          # Work in flight: open agent pull requests, plus real implement runs not
          # finished yet (they have not opened their pull request).
          OPEN_PRS=$(gh pr list --repo "$REPO" --state open --label agent --json number --jq 'length')
          RUNNING=$(runs --jq '[.[] | select(.status != "completed")]' | count_real)
          SLOTS=$(( MAX_OPEN - OPEN_PRS - RUNNING ))
          TODAY=$(runs --created ">=$(date -u +%Y-%m-%d)" | count_real)
          LEFT_TODAY=$(( MAX_PER_DAY - TODAY ))
          [ "$LEFT_TODAY" -lt "$SLOTS" ] && SLOTS="$LEFT_TODAY"
          say "Sprint \`$SPRINT\`: $OPEN_PRS open agent PR(s), $RUNNING run(s) in flight, $TODAY started today; $SLOTS slot(s)."
          [ "$SLOTS" -gt 0 ] || exit 0

          # Issues an open pull request says it fixes, and issues an implement run
          # is still working on (its run name is "Implement #N").
          FIXING=$( { gh pr list --repo "$REPO" --state open --limit 200 --json body --jq '.[].body // ""' \
                        | { grep -oiE '(fixes|closes|resolves) #[0-9]+' || true; }
                      runs --jq '.[] | select(.status != "completed") | .displayTitle' \
                        | { grep -oE '^Implement #[0-9]+' || true; }; } \
            | { grep -oE '[0-9]+' || true; } | jq -R 'tonumber' | jq -sc 'unique')

          CANDIDATES=$(gh api graphql --paginate -F owner="${REPO%/*}" -F name="${REPO#*/}" -f query='
            query($owner: String!, $name: String!, $endCursor: String) { repository(owner: $owner, name: $name) {
              issues(states: OPEN, labels: ["ready"], first: 100, after: $endCursor) {
                pageInfo { hasNextPage endCursor }
                nodes { number title createdAt
                  milestone { title } issueType { name }
                  labels(first: 30) { nodes { name } }
                  issueFieldValues(first: 10) { nodes { ... on IssueFieldSingleSelectValue {
                    name field { ... on IssueFieldSingleSelect { name } } } } }
                  blockedBy(first: 50) { nodes { number state labels(first: 30) { nodes { name } } } } } } } }' \
            --jq '.data.repository.issues.nodes[]' | jq -s -c --arg sprint "$SPRINT" --argjson fixing "$FIXING" '
              map({number, title, createdAt,
                   sprint: (.milestone.title // ""), type: (.issueType.name // ""),
                   labels: [.labels.nodes[].name],
                   priority: ([.issueFieldValues.nodes[] | select(.field.name? == "Priority") | .name][0] // ""),
                   waiting: [.blockedBy.nodes[] | select(.state == "OPEN" and ([.labels.nodes[].name] | index("merged") | not)) | .number]})
              | map(select(.sprint == $sprint
                           and (.type != "Epic" and .type != "Spike")
                           and ([.labels[] | select(. == "needs-human" or . == "merged" or . == "human" or . == "paused")] | length == 0)
                           and (.number as $n | $fixing | index($n) | not)
                           and (.waiting | length == 0)))
              | sort_by([({"High": 0, "Medium": 1, "Low": 2}[.priority] // 3), .createdAt])')
          say "Startable: $(jq -r 'map("#\(.number)" + (if .priority != "" then " (\(.priority))" else "" end)) | join(", ") | if . == "" then "none" else . end' <<<"$CANDIDATES")"

          for N in $(jq -r --argjson k "$SLOTS" '.[:$k][].number' <<<"$CANDIDATES"); do
            if [ "$DRY_RUN" = "true" ]; then say "would start #$N"; continue; fi
            GH_TOKEN="$ACTIONS_TOKEN" bash .github/scripts/dispatch.sh implement.lock.yml issue "$N" >/dev/null
            say "started #$N"
          done
