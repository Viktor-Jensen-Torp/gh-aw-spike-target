name: Back to refinement

# `refined` and `ready` mean "and nothing it rests on has changed since".
# A change nobody approved takes both away and puts `needs-refinement` on, the
# moment it happens, with a one-line comment saying what changed. The refiner
# picks it up on its next run: it marks it `refined` again if the issue still
# holds, or rewrites it, or asks; a person then confirms `ready` again.
#
# What counts as a change:
#   - a commit changes a file listed under its epic's "Sources"; for a pen
#     design file, only a change inside an element the issue claims
#     (`design.pen#<id>`), found by .github/scripts/design-diff.sh;
#   - a spike it is blocked by closes (a spike's result is a decision).
# A blocker that merely closes changes no requirement, so it does not count.
#
# A person's own edit or comment does not count: people set `ready`, so they
# decide. One who changes what an issue asks for adds `needs-refinement`
# themselves. (Until 2026-09-30 any edit or comment counted, so adding a design
# image un-readied an issue, and on a public repository anyone could un-ready
# every issue by commenting.)
#
# GITHUB_TOKEN on purpose. Its writes start no workflow, so neither this job's
# comments nor the refiner's own edits (also GITHUB_TOKEN) come back here as a
# change. Only issues that are `refined` or `ready` are touched, which also
# makes a second trigger for the same change (a sync merge re-pushing a source)
# a no-op.

on:
  issues:
    types: [closed]
  # develop only: changes land there. A release merge into main repeats every
  # change since the last release at once, so its design diff made each claimed
  # part look new and sent 21 ready Tasks issues back (release 8f68fd5,
  # 2026-09-30); they had all been handled on develop already.
  push:
    branches: [develop]

permissions:
  contents: read
  issues: write
  # Dispatches refine on the epics a design change touched (#259).
  actions: write

jobs:
  unready:
    # An issue closed by a bot is the pipeline's own. A push is judged by what
    # it changes, not who pushed it: the merge queue pushes as a bot, so a
    # design change merged through the queue was never seen (#259).
    if: github.event_name == 'push' || github.event.sender.type != 'Bot'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        if: github.event_name == 'push'
        with:
          sparse-checkout: .github/scripts
      - name: Send what this change made stale back to refinement
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT: ${{ github.event_name }}
          ACTION: ${{ github.event.action }}
          NUMBER: ${{ github.event.issue.number }}
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.event.after }}
          ACTIONS_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          # unready <issue> <reason>: only an open, `refined` or `ready` issue
          # is touched.
          unready() {
            local n="$1" why="$2" info
            info=$(gh api "repos/$REPO/issues/$n" --jq '{state, staged: ([.labels[].name] | any(. == "ready" or . == "refined"))}')
            if [ "$(jq -r '.state' <<<"$info")" != "open" ] || [ "$(jq -r '.staged' <<<"$info")" != "true" ]; then
              echo "#$n: not open and refined or ready; left alone"; return 0
            fi
            gh api -X DELETE "repos/$REPO/issues/$n/labels/ready" --silent 2>/dev/null || true
            gh api -X DELETE "repos/$REPO/issues/$n/labels/refined" --silent 2>/dev/null || true
            gh api -X POST "repos/$REPO/issues/$n/labels" -f "labels[]=needs-refinement" --silent
            gh api -X POST "repos/$REPO/issues/$n/comments" --silent \
              -f body="Back to refinement: $why"
            echo "#$n: back to refinement ($why)"
          }
          sub_issues() { gh api --paginate "repos/$REPO/issues/$1/sub_issues" --jq '.[] | select(.state == "open") | .number'; }

          case "$EVENT/$ACTION" in
            issues/closed)
              TYPE=$(gh api "repos/$REPO/issues/$NUMBER" --jq '.type.name // ""')
              [ "$TYPE" = "Spike" ] || { echo "Not a spike; a closed blocker changes no requirement."; exit 0; }
              for D in $(gh api --paginate "repos/$REPO/issues/$NUMBER/dependencies/blocking" --jq '.[].number'); do
                unready "$D" "the spike it waited on, #$NUMBER, closed. Read its result."
              done ;;

            push/*)
              case "$BEFORE" in ""|0000000000000000000000000000000000000000) echo "New branch; nothing to compare."; exit 0 ;; esac
              FILES=$(gh api "repos/$REPO/compare/$BEFORE...$AFTER" --jq '.files[].filename')
              [ -n "$FILES" ] || exit 0
              OPEN=$(gh api --paginate "repos/$REPO/issues?state=open&per_page=100" \
                       --jq '.[] | select(has("pull_request") | not) | {number, body: (.body // ""), type: (.type.name // "")}' | jq -s '.')

              # Design files, element by element (#259). An issue claims the
              # parts it builds as `path#id`; a change inside a claimed part,
              # or inside a component that part uses, touches the issue
              # (design-impact.sh). Open issues go back to refinement and their
              # epics are refined at once; built (closed) issues get one draft
              # follow-up for what no open issue covers; changes no issue claims
              # are new work, said on the epics that list the file.
              EPICS=""
              for PEN in $(grep -E '\.pen$' <<<"$FILES" || true); do
                fetch() { gh api -H "Accept: application/vnd.github.raw" "repos/$REPO/contents/$PEN?ref=$1" 2>/dev/null \
                            || echo '{"children": []}'; }
                fetch "$BEFORE" > old.pen; fetch "$AFTER" > new.pen
                gh api --paginate "repos/$REPO/issues?state=all&per_page=100" \
                  --jq ".[] | select(has(\"pull_request\") | not) | select((.body // \"\") | contains(\"$PEN#\"))
                         | {number, title, state, body, type: (.type.name // \"\")}" | jq -s '.' > claims.json
                IMPACT=$(bash .github/scripts/design-impact.sh "$PEN" old.pen new.pen claims.json)
                echo "$PEN: $(jq .changes <<<"$IMPACT") element(s) changed, $(jq '.hits | length' <<<"$IMPACT") issue(s) touched"
                [ "$(jq .changes <<<"$IMPACT")" -gt 0 ] || continue
                parts() { jq -r '(.[:5] | join(", ")) + (if length > 5 then ", …" else "" end)'; }

                for N in $(jq -r '.hits[] | select(.state == "open") | .number' <<<"$IMPACT"); do
                  P=$(jq -c --argjson n "$N" '.hits[] | select(.number == $n) | .parts' <<<"$IMPACT" | parts)
                  unready "$N" "the design changed where this issue claims it (\`$PEN\` at ${AFTER:0:8}): $P."
                  E=$(gh api "repos/$REPO/issues/$N" --jq '.parent_issue_url // "" | split("/") | last')
                  [ -z "$E" ] || EPICS="$EPICS $E"
                done

                # Built issues: the code no longer follows the design. One open
                # follow-up per built issue: an open issue saying "Follows #N"
                # is it, and gets the new parts as a comment; otherwise a draft
                # (no stage label, so nothing starts it until a person says so).
                BLOB=$(gh api "repos/$REPO/contents/$PEN?ref=$AFTER" --jq .sha 2>/dev/null || echo removed)
                for N in $(jq -r '.hits[] | select(.state == "closed" and (.unowned | length) > 0) | .number' <<<"$IMPACT"); do
                  HIT=$(jq -c --argjson n "$N" '.hits[] | select(.number == $n)' <<<"$IMPACT")
                  P=$(jq -c '.unowned' <<<"$HIT" | parts)
                  MARK="<!-- design-followup:$N:$BLOB -->"
                  FOLLOW=$(jq -r --argjson n "$N" '[.[] | select(.state == "open") | select((.body // "") | test("Follows #\($n)([^0-9]|$)")) | .number] | first // empty' claims.json)
                  if [ -n "$FOLLOW" ]; then
                    gh api --paginate "repos/$REPO/issues/$FOLLOW/comments" --jq '.[].body' | grep -qF "$MARK" && continue
                    gh api -X POST "repos/$REPO/issues/$FOLLOW/comments" --silent \
                      -f body="$(printf '%s\nThe design changed again inside parts #%s claims (`%s` at %s): %s.' "$MARK" "$N" "$PEN" "${AFTER:0:8}" "$P")"
                    echo "#$FOLLOW: told of new design changes for #$N"; continue
                  fi
                  ORIG=$(jq -c --argjson n "$N" '.[] | select(.number == $n)' claims.json)
                  CLAIMS=$(jq -r '.body' <<<"$ORIG" | grep -E "^\`$PEN#[A-Za-z0-9_-]+\`" || true)
                  BODY=$(printf '%s\n## What\n\n#%s'"'"'s build follows the design again: %s.\n\n## Why\n\nThe design changed inside parts #%s claims (`%s` at %s): %s. #%s is closed, so nothing else brings its code in line.\n\n## Details\n\nFollows #%s\n\n- Compare the built code with the claimed parts'"'"' JSON and change what differs.\n\n## Done when\n\nTo be written when this is refined.\n\n## Design\n\n%s\n\n## Out of scope\n\nTo be named when this is refined.\n' \
                    "$MARK" "$N" "$(jq -r .title <<<"$ORIG")" "$N" "$PEN" "${AFTER:0:8}" "$P" "$N" "$N" "$CLAIMS")
                  TYPE=$(jq -r '.type // ""' <<<"$ORIG"); [ -n "$TYPE" ] || TYPE=Task
                  T="Design changed: $(jq -r .title <<<"$ORIG")"
                  # With its type when the token may set it; without, rather than not at all.
                  NEW=$(jq -n --arg t "$T" --arg b "$BODY" --arg ty "$TYPE" '{title: $t, body: $b, type: $ty}' \
                          | gh api -X POST "repos/$REPO/issues" --input - --jq '"\(.number) \(.id)"' 2>/dev/null) \
                    || NEW=$(jq -n --arg t "$T" --arg b "$BODY" '{title: $t, body: $b}' \
                          | gh api -X POST "repos/$REPO/issues" --input - --jq '"\(.number) \(.id)"')
                  E=$(gh api "repos/$REPO/issues/$N" --jq '.parent_issue_url // "" | split("/") | last')
                  if [ -n "$E" ]; then
                    # The epic is not done while its follow-up is open.
                    gh api -X PATCH "repos/$REPO/issues/$E" -f state=open --silent || true
                    gh api -X POST "repos/$REPO/issues/$E/sub_issues" -F "sub_issue_id=${NEW#* }" --silent \
                      || echo "::warning::could not link #${NEW% *} under #$E"
                  fi
                  echo "#${NEW% *}: draft follow-up for built #$N${E:+ under #$E}"
                done

                UNCOVERED=$(jq -r '.uncovered | map("\(.name) (\(.count))") | join(", ")' <<<"$IMPACT")
                [ -n "$UNCOVERED" ] || continue
                for E in $(jq -r --arg p "$PEN" '.[] | select(.type == "Epic") | select(.body | contains("`" + $p)) | .number' <<<"$OPEN"); do
                  MARK="<!-- design-uncovered:$PEN:$BLOB -->"
                  gh api --paginate "repos/$REPO/issues/$E/comments" --jq '.[].body' | grep -qF "$MARK" && continue
                  MSG="Design changes in \`$PEN\` (${AFTER:0:8}) that no issue claims: $UNCOVERED. Run \`/decompose\` to turn them into issues."
                  gh api -X POST "repos/$REPO/issues/$E/comments" --silent -f body="$(printf '%s\n%s' "$MARK" "$MSG")"
                  echo "#$E: told of uncovered design changes"
                done
              done

              # Refine what went back now, not tonight, with the design diff:
              # one dispatch per epic (refine takes an epic's pieces).
              for E in $(tr ' ' '\n' <<<"$EPICS" | grep . | sort -u); do
                GH_TOKEN="$ACTIONS_TOKEN" bash .github/scripts/dispatch.sh refine.lock.yml issue "$E" design_since="$BEFORE" \
                  || echo "::warning::could not dispatch refine on #$E"
              done

              # Other sources, file by file, through the epics' "## Sources".
              for E in $(jq -r '.[] | select(.type == "Epic") | .number' <<<"$OPEN"); do
                SOURCES=$(jq -r --argjson e "$E" '.[] | select(.number == $e) | .body' <<<"$OPEN" \
                  | awk '/^## /{f=($0 ~ /^## Sources/)} f' | grep -oE '`[^`]+`' | tr -d '`' | grep -v -e '…' -e '\.pen' || true)
                for P in $SOURCES; do
                  # A listed path is a file or a directory: match it, or anything under it.
                  HIT=""
                  while IFS= read -r F; do
                    if [ "$F" = "$P" ] || [ "${F#"${P%/}/"}" != "$F" ]; then HIT="$F"; break; fi
                  done <<<"$FILES"
                  [ -n "$HIT" ] || continue
                  for S in $(sub_issues "$E"); do
                    unready "$S" "\`$HIT\`, a source of its epic #$E, changed in ${AFTER:0:8}."
                  done
                  break
                done
              done ;;
          esac
