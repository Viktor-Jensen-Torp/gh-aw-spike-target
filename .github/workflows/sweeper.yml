name: Sweeper

# Catches agent pull requests that no event will ever revisit.
#
# Deliberately NOT an agentic workflow, unlike gh-aw's own pr-sous-chef. Its
# whole purpose is to catch work the chain dropped, and a catcher that can
# itself drop things is worth little: "obligations never live in a prompt".
# gh-aw's sweeper is agentic because its actuator is a comment addressed to
# Copilot, which needs judgement to write; ours is a label, which does not. Its
# detection half is a deterministic shell prefilter too — that half is what this
# copies.
#
# Every case here is one no event can reach.

on:
  schedule:
    # Every 30 minutes. Free on a public repository; one short job per tick.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write        # delete the branches of merged agent pull requests
  pull-requests: write   # arm auto-merge, comment
  issues: write          # labels live on the issue side of a pull request
  actions: write         # dispatch the unblocker at a conflicted pull request

concurrency:
  group: sweeper
  cancel-in-progress: false

jobs:
  sweep:
    runs-on: ubuntu-latest
    steps:
      # Escalation labels must be written with an App token, not GITHUB_TOKEN.
      # `needs-human` is only a stop button because hold.yml re-runs on the
      # `labeled` event and turns its required check red; GITHUB_TOKEN-authored
      # events do not trigger workflows, so a label written with it would leave
      # the gate green and the pull request merging.
      - uses: actions/create-github-app-token@v3
        id: app_token
        with:
          client-id: ${{ vars.REVIEWER_CLIENT_ID }}
          private-key: ${{ secrets.REVIEWER_APP_PRIVATE_KEY }}
          # Only adds `needs-human` to a pull request (label_as_app).
          permission-issues: write
      # The implementer App, for arming auto-merge: the merge queue runs its
      # checks only for an entry queued by an identity whose events start
      # workflows. Armed with GITHUB_TOKEN, #136 sat in the queue with no
      # `merge_group` run and was dropped after 30 minutes (2026-09-29).
      - uses: actions/create-github-app-token@v3
        id: implementer_token
        with:
          client-id: ${{ vars.IMPLEMENTER_CLIENT_ID }}
          private-key: ${{ secrets.IMPLEMENTER_APP_PRIVATE_KEY }}
          # Only arms auto-merge (enablePullRequestAutoMerge).
          permission-contents: write
          permission-pull-requests: write

      # The check-run reader shared with review.md (.github/scripts/check-runs.sh).
      - uses: actions/checkout@v5
        with:
          sparse-checkout: .github/scripts
          persist-credentials: false

      - name: Sweep
        env:
          GH_TOKEN: ${{ github.token }}
          APP_TOKEN: ${{ steps.app_token.outputs.token }}
          IMPLEMENTER_TOKEN: ${{ steps.implementer_token.outputs.token }}
          REPO: ${{ github.repository }}
          BASE: develop
          # Bound every run. A sweeper that acts on everything it finds turns a
          # systemic fault into a systemic write.
          MAX_ACTIONS: "10"
          # How long a head commit may sit with no review verdict before that
          # counts as "the review will never run" rather than "it is running".
          VERDICT_GRACE_MINUTES: "20"
        run: |
          set -euo pipefail

          acted=0
          declare -i n_conflict=0 n_noverdict=0 n_stuck=0 n_armed=0 n_branch=0 n_skipped=0 n_approved=0 n_review=0 n_detect=0 n_detect_human=0

          budget_left() { [ "$acted" -lt "$MAX_ACTIONS" ]; }
          spend() { acted=$((acted + 1)); }

          # One comment per case per head commit. Without a marker the sweeper
          # repeats itself every 30 minutes forever.
          already_said() { # <pr> <marker>
            gh api "repos/$REPO/issues/$1/comments" --paginate --jq '.[].body' \
              | grep -qF "$2"
          }
          say() { # <pr> <marker> <body>
            already_said "$1" "$2" && return 0
            printf '%s\n\n%s\n' "$3" "$2" \
              | gh api -X POST "repos/$REPO/issues/$1/comments" -F body=@- --silent
          }
          label_as_app() { # <pr> <label>
            GH_TOKEN="$APP_TOKEN" gh api -X POST "repos/$REPO/issues/$1/labels" \
              -f "labels[]=$2" --silent
          }

          echo "## Sweeper" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          # ---- open agent pull requests -------------------------------------
          PRS=$(gh pr list --repo "$REPO" --state open --base "$BASE" --limit 100 \
            --json number,headRefOid,isDraft,labels,mergeable,mergeStateStatus,autoMergeRequest,author \
            --jq '[.[] | select([.labels[].name] | index("agent"))]')

          echo "open agent pull requests on $BASE: $(jq 'length' <<<"$PRS")"

          for row in $(jq -r '.[] | @base64' <<<"$PRS"); do
            _() { base64 -d <<<"$row" | jq -r "$1"; }
            PR=$(_ '.number'); SHA=$(_ '.headRefOid'); DRAFT=$(_ '.isDraft')
            MERGEABLE=$(_ '.mergeable'); AM=$(_ '.autoMergeRequest // "null"')
            # `mergeable` is computed lazily and reads UNKNOWN until a
            # background job finishes. A single read therefore misses exactly
            # the pull requests this job exists for — run 35796245303 saw
            # UNKNOWN on two genuinely conflicted ones and swept nothing.
            if [ "$MERGEABLE" = "UNKNOWN" ]; then
              for _ in 1 2 3 4 5; do
                sleep 4
                MERGEABLE=$(gh api "repos/$REPO/pulls/$PR" --jq '.mergeable // "UNKNOWN"' \
                  | sed 's/^true$/MERGEABLE/; s/^false$/CONFLICTING/; s/^null$/UNKNOWN/')
                [ "$MERGEABLE" = "UNKNOWN" ] || break
              done
            fi
            LABELS=$(_ '[.labels[].name] | join(",")')
            echo "--- PR #$PR sha=${SHA:0:8} mergeable=$MERGEABLE labels=$LABELS"

            # A pull request a person is already holding, or has paused, is not
            # ours to touch. When `paused` comes off, the next sweep picks it up
            # again: that is how a paused pull request resumes.
            case ",$LABELS," in *,needs-human,*|*,paused,*) n_skipped=$((n_skipped+1)); continue;; esac

            # 1. Conflicted. A conflict's first responder is unblock.md, sent
            #    by unblock-detect.yml on the push that caused it. This is the
            #    backstop for a conflict that arrived some other way — a push
            #    that predates the detector, a dispatch that failed, a branch
            #    that drifted.
            #
            #    It DISPATCHES rather than labelling `needs-human`. Escalating
            #    here would pre-empt the automatic fix. But only ONCE per head
            #    commit: an unblock run that ends without labelling (a refused
            #    push, a failed run) would otherwise be re-sent every 30 minutes,
            #    and dispatched runs skip the daily AI-credit cap (spec §9.8).
            #    Still conflicted after that one try means a person.
            if [ "$MERGEABLE" = "CONFLICTING" ]; then
              if budget_left; then
                if already_said "$PR" "<!-- sweeper:unblock-sent:$SHA -->"; then
                  label_as_app "$PR" needs-human
                  say "$PR" "<!-- sweeper:conflict:$SHA -->" \
                    "**Swept:** this pull request still conflicts with \`$BASE\` after the unblocker was sent at \`${SHA:0:8}\`. Labelled \`needs-human\`: resolve the conflict, then remove the label to release the merge."
                  spend
                elif gh workflow run unblock.lock.yml -f pr="$PR" 2>/dev/null; then
                  say "$PR" "<!-- sweeper:unblock-sent:$SHA -->" \
                    "**Swept:** conflicts with \`$BASE\`. Sent the unblocker once for \`${SHA:0:8}\`; if it is still conflicted on the next sweep, a person is called."
                  echo "-> dispatched the unblocker at #$PR"
                  spend; n_conflict=$((n_conflict+1))
                else
                  # If even the dispatch fails, a person is the only option left.
                  label_as_app "$PR" needs-human
                  say "$PR" "<!-- sweeper:conflict:$SHA -->" \
                    "**Swept:** this pull request conflicts with \`$BASE\` and the unblocker could not be dispatched. Resolve the conflict, then remove \`needs-human\` to release the merge."
                  spend
                fi
              fi
              continue
            fi

            # 2. No verdict on this head commit. The review was skipped or
            #    errored (a crashed agent, E009 lock drift, a push by a bot that
            #    gh-aw's confused-deputy guard refused). Nothing re-runs a review
            #    on its own, so the pull request would wait forever on a
            #    required check that will never report.
            VERDICT=$(bash .github/scripts/check-runs.sh latest "$SHA" "Agent review")
            if [ -z "$VERDICT" ]; then
              PUSHED=$(gh api "repos/$REPO/commits/$SHA" --jq '.commit.committer.date')
              AGE=$(( ( $(date -u +%s) - $(date -u -d "$PUSHED" +%s) ) / 60 ))
              if [ "$AGE" -ge "$VERDICT_GRACE_MINUTES" ] && budget_left; then
                # Send the review once per head commit by dispatch, then a
                # person. A dispatch has no actor for gh-aw's confused-deputy
                # guard to refuse (check_permissions_utils.cjs) and, unlike
                # closing and reopening, leaves auto-merge armed.
                if ! already_said "$PR" "<!-- sweeper:review-sent:$SHA -->"; then
                  bash .github/scripts/dispatch.sh review.lock.yml pr "$PR" sha="$SHA" >/dev/null
                  say "$PR" "<!-- sweeper:review-sent:$SHA -->" \
                    "**Swept:** no \`Agent review\` verdict on \`${SHA:0:8}\` after ${AGE} minutes. Sent the review. If this leaves no verdict either, the next sweep calls a person."
                  spend; n_review=$((n_review+1))
                else
                  label_as_app "$PR" needs-human
                  say "$PR" "<!-- sweeper:noverdict:$SHA -->" \
                    "**Swept:** still no \`Agent review\` verdict on \`${SHA:0:8}\` after the review was sent, so the review is not going to run on its own. The required check will never report and this pull request cannot merge. Labelled \`needs-human\`."
                  spend; n_noverdict=$((n_noverdict+1))
                fi
              fi
              continue
            fi

            # 3. Something is red and nothing is acting on it: a red `Agent
            #    review`, or a red required CI check (test, lint, conventions)
            #    that finished after the review had already routed. A strike
            #    was spent on a rework round that never landed (PRs #12, #16),
            #    or none was started. Dispatching rework starts a round; its
            #    three-strike gate still bounds it. Once per head commit, and
            #    not while a rework run for this pull request is in flight.
            RED_CI=$(bash .github/scripts/check-runs.sh failing "$SHA" test lint conventions)
            REWORKING=$(gh run list --repo "$REPO" --workflow rework.lock.yml --limit 50 \
              --json status,displayTitle --jq "[.[] | select(.status != \"completed\" and .displayTitle == \"Rework #$PR\")] | length")
            if { [ "$VERDICT" = "failure" ] || [ "${RED_CI:-0}" -gt 0 ]; } && [ "$REWORKING" = 0 ] \
               && ! already_said "$PR" "<!-- sweeper:stuck:$SHA -->" && budget_left; then
              bash .github/scripts/dispatch.sh rework.lock.yml pr "$PR" sha="$SHA" >/dev/null
              say "$PR" "<!-- sweeper:stuck:$SHA -->" \
                "**Swept:** \`${SHA:0:8}\` is red (Agent review: ${VERDICT}, failing CI checks: ${RED_CI:-0}) but nothing was acting on it. Sent rework. Its three-strike gate still applies."
              spend; n_stuck=$((n_stuck+1))
              continue
            fi

            # 4. Auto-merge was never armed. gh-aw arms it best-effort at
            #    creation: a failure is only a core.warning and the pull request
            #    is still created, so one that will never merge looks exactly
            #    like one that is waiting. (gh-aw's arming does work under the
            #    merge queue: PR #38 merged through it untouched. This is the
            #    backstop.) Armed with no method, which a queued branch accepts;
            #    the queue decides how.
            if [ "$AM" = "null" ] && [ "$DRAFT" = "false" ] && budget_left; then
              NODE=$(gh api "repos/$REPO/pulls/$PR" --jq '.node_id')
              if GH_TOKEN="$IMPLEMENTER_TOKEN" gh api graphql -f query='
                    mutation($id: ID!) {
                      enablePullRequestAutoMerge(input: {pullRequestId: $id}) {
                        pullRequest { number }
                      }
                    }' -f id="$NODE" --silent 2>/dev/null; then
                say "$PR" "<!-- sweeper:armed:$PR -->" \
                  "**Swept:** auto-merge was not armed, so this pull request would have waited for a merge nobody had asked for. Armed it without naming a method, which is what a queued branch accepts — the merge queue decides how, and the \`develop gate\` decides when."
                spend; n_armed=$((n_armed+1))
              else
                echo "#$PR: could not arm auto-merge"
              fi
            fi
          done

          # ---- agent runs lost to a threat-detection crash --------------------
          # gh-aw scans an agent's output before anything is written. When the
          # scanner itself crashes ("Threat Detection Engine Failure ... a tooling
          # failure, not a security finding"), the safe outputs are skipped and the
          # agent's finished work is lost: no pull request, or no push. No event
          # follows, so nothing retries it (rework run 36675721641 on #205,
          # 2026-09-30). Re-running the run's failed jobs scans the same output
          # again and writes it; the agent does not run again. Once only: a second
          # crash hands the issue or pull request to a person. Never a strike: a
          # strike says the work was rejected, and this says nothing about the work.
          SINCE=$(date -u -d '-6 hours' +%Y-%m-%dT%H:%M:%SZ)
          for WF in implement rework unblock; do
            RUNS=$(gh run list --repo "$REPO" --workflow "$WF.lock.yml" --status failure --created ">=$SINCE" \
                     --limit 20 --json databaseId,attempt,displayTitle 2>/dev/null || echo '[]')
            for row in $(jq -r '.[] | @base64' <<<"$RUNS"); do
              budget_left || break 2
              RID=$(base64 -d <<<"$row" | jq -r '.databaseId')
              ATTEMPT=$(base64 -d <<<"$row" | jq -r '.attempt')
              TITLE=$(base64 -d <<<"$row" | jq -r '.displayTitle')
              JOBS=$(gh run view "$RID" --repo "$REPO" --attempt "$ATTEMPT" --json jobs --jq '[.jobs[] | {name, conclusion, databaseId}]')
              # Only the scan failed: the agent finished, and nothing else broke.
              [ "$(jq -r '[.[] | select(.name == "agent")][0].conclusion // ""' <<<"$JOBS")" = success ] || continue
              DJ=$(jq -r '[.[] | select(.name == "detection" and .conclusion == "failure")][0].databaseId // empty' <<<"$JOBS")
              [ -n "$DJ" ] || continue
              # A tooling crash, not a finding: a real threat is never retried.
              gh run view "$RID" --repo "$REPO" --attempt "$ATTEMPT" --log-failed 2>/dev/null \
                | grep -q "tooling failure, not a security finding" || continue
              N=$(grep -oE '#[0-9]+' <<<"$TITLE" | head -1 | tr -d '#')
              [ -n "$N" ] || continue
              if [ "$ATTEMPT" -le 1 ]; then
                if gh run rerun "$RID" --failed --repo "$REPO" 2>/dev/null; then
                  echo "$TITLE (run $RID): threat detection crashed; re-ran its failed jobs"
                  spend; n_detect=$((n_detect+1))
                fi
              else
                MARK="<!-- sweeper:detection:$RID -->"
                already_said "$N" "$MARK" && continue
                say "$N" "$MARK" \
                  "**Swept:** gh-aw's threat detection crashed twice on [$TITLE]($GITHUB_SERVER_URL/$REPO/actions/runs/$RID), so the agent's finished work was never written. This is a tooling failure, not a security finding. Re-run the run's failed jobs once it is fixed, or remove \`needs-human\` to let the pipeline start again."
                label_as_app "$N" needs-human
                echo "$TITLE (run $RID): detection crashed twice; handed #$N to a person"
                spend; n_detect_human=$((n_detect_human+1))
              fi
            done
          done

          # ---- workflow runs waiting for approval -----------------------------
          # A push from `github-actions[bot]` leaves its workflow runs in
          # `action_required`, waiting for a person. The unblocker's push is
          # exactly that: resolving a conflict produces a MERGE commit, gh-aw's
          # signed-commit path refuses merge commits, and the unsigned path
          # pushes as `github-actions[bot]` rather than the App — there is no
          # config to set the commit identity. So the re-review after a
          # conflict fix never starts, and the pull request waits on a verdict
          # that will never come (PR #41: Review run 35814898713,
          # `action_required`, caught by the no-verdict case four hours later).
          #
          # Approving is scoped hard: only runs on the head branch of an OPEN
          # pull request carrying `agent`. A run on anything else is none of
          # this job's business.
          PENDING=$(gh api "repos/$REPO/actions/runs?status=action_required&per_page=30" \
            --jq '[.workflow_runs[] | {id, name, head_branch}]' 2>/dev/null || echo '[]')
          AGENT_BRANCHES=$(gh pr list --repo "$REPO" --state open --base "$BASE" --limit 100 \
            --json headRefName,labels \
            --jq '[.[] | select([.labels[].name] | index("agent")) | .headRefName]')
          for row in $(jq -r '.[] | @base64' <<<"$PENDING"); do
            budget_left || break
            RID=$(base64 -d <<<"$row" | jq -r '.id')
            RBR=$(base64 -d <<<"$row" | jq -r '.head_branch')
            RNM=$(base64 -d <<<"$row" | jq -r '.name')
            if ! jq -e --arg b "$RBR" 'index($b)' >/dev/null <<<"$AGENT_BRANCHES"; then
              echo "waiting run $RID ($RNM on $RBR): not an agent branch, leaving it"
              continue
            fi
            if gh api -X POST "repos/$REPO/actions/runs/$RID/approve" --silent 2>/dev/null; then
              echo "approved run $RID ($RNM on $RBR)"
              spend; n_approved=$((n_approved+1))
            else
              echo "could not approve run $RID ($RNM on $RBR)"
            fi
          done

          # ---- branches of merged agent pull requests ------------------------
          # A backstop: delete_branch_on_merge normally removes these. Only
          # branches whose pull request was opened by the implementer App and is
          # already merged are touched.
          MERGED=$(gh pr list --repo "$REPO" --state merged --base "$BASE" --limit 50 \
            --json number,headRefName,author,mergedAt \
            --jq '[.[] | select(.author.login == "app/gh-aw-spike-implementer")]')
          for row in $(jq -r '.[] | @base64' <<<"$MERGED"); do
            budget_left || break
            BR=$(base64 -d <<<"$row" | jq -r '.headRefName')
            N=$(base64 -d <<<"$row" | jq -r '.number')
            gh api "repos/$REPO/branches/$BR" --silent 2>/dev/null || continue
            OPEN=$(gh pr list --repo "$REPO" --state open --head "$BR" --json number --jq 'length')
            [ "$OPEN" = "0" ] || continue
            gh api -X DELETE "repos/$REPO/git/refs/heads/$BR" --silent
            echo "deleted $BR (merged in #$N)"
            spend; n_branch=$((n_branch+1))
          done

          {
            echo "| case | acted |"
            echo "|---|---|"
            echo "| conflicted → unblocker dispatched | $n_conflict |"
            echo "| no verdict → review sent | $n_review |"
            echo "| still no verdict → needs-human | $n_noverdict |"
            echo "| red, nothing acting → rework sent | $n_stuck |"
            echo "| auto-merge armed | $n_armed |"
            echo "| detection crashed → failed jobs re-run | $n_detect |"
            echo "| detection crashed twice → needs-human | $n_detect_human |"
            echo "| gated runs approved | $n_approved |"
            echo "| merged branches deleted | $n_branch |"
            echo "| skipped (already held by a person) | $n_skipped |"
            echo ""
            echo "Budget $acted/$MAX_ACTIONS."
          } >> "$GITHUB_STEP_SUMMARY"

          # Never finish silently: a do-nothing run still says so, and says why.
          # Written as an `if`, not `[ ... ] && echo`: under `set -e` a false
          # test as the last command would fail the job on a successful sweep.
          if [ "$acted" -eq 0 ]; then
            echo "nothing to sweep" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "swept: $acted action(s)"
