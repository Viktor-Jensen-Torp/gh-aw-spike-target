name: Hold

# A stop button a person can press, expressed as a required check.
#
# The merge gate on `develop` is "every required check is green". This workflow
# turns the `needs-human` label into one of those checks, so a person (or an
# agent escalating after three strikes) can halt a pending auto-merge by adding
# the label, and release it by removing it. Nothing has to re-arm the merge:
# the check simply goes green again and GitHub proceeds.
#
# It must run on every pull request, not only labelled ones. A required check
# that never reports leaves the pull request pending forever.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  # A required check that never reports on the queue's temporary branch leaves
  # the entry to time out and be ejected — silently. So this must report here
  # too. A merge group carries no labels, so the step below simply finds nothing
  # to hold and passes: the hold was enforced when the pull request was allowed
  # into the queue.
  #
  # The gap that leaves, honestly: a `needs-human` applied AFTER a pull request
  # is queued does not bite. Closing it needs the label handler to remove the
  # entry from the queue.
  merge_group:

permissions:
  contents: read

jobs:
  hold:
    runs-on: ubuntu-latest
    steps:
      - name: Hold while needs-human is set
        if: contains(github.event.pull_request.labels.*.name, 'needs-human')
        run: |
          echo "::error::needs-human is on this pull request; a person is looking at it. Holding the merge."
          exit 1
      - name: Nothing holding this pull request
        run: echo "No needs-human label; this gate is clear."
