name: Merge group gate

# Reports `hold` and `Agent review` for a merge group — for real, not as a
# formality.
#
# The constraint: a merge queue requires EVERY required status check to report
# on its temporary branch, and there is no way to mark a check
# pull-request-only. But `Agent review` is a check run the reviewer App posts
# against a PULL REQUEST's head commit, and `hold` reads a label a temporary
# branch does not have. Neither can report here by itself.
#
# The easy answer is to pass trivially and say the real gate happened at the
# queue door. That is a vacuous gate, and an absent gate is
# visible while a vacuous one is not.
#
# So instead this VERIFIES the thing the queue door is supposed to have
# guaranteed: every pull request in this group carries a green `Agent review`
# on its current head commit, and none of them is being held by
# a person. That is a real invariant, it is checked deterministically, and it
# catches the two ways the door can be wrong — a verdict that was never posted,
# and a `needs-human` applied AFTER the pull request was queued, which the
# pull-request-side check can no longer see.
#
# Which pull requests are in the group comes from the queue branch's name, which
# carries them: `gh-readonly-queue/develop/pr-36-<sha>`. GitHub documents only
# the prefix, so that format is established by observation (run 35807427496),
# and git ancestry is kept as a fallback. Ancestry alone does NOT work, which is
# how the first version of this file ejected a perfectly good pull request: the
# queue squashes, so the group's commit is a squash and the pull request's own
# commits are not ancestors of it.
#
# Both jobs FAIL CLOSED. If the group's members cannot be determined, that is a
# failure, not a pass — the whole point of this file is to not wave things
# through.

on:
  merge_group:

permissions:
  contents: read
  pull-requests: read
  checks: read

jobs:
  hold:
    name: hold
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Refuse if any queued pull request is being held
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.merge_group.base_ref }}
          HEAD: ${{ github.event.merge_group.head_ref }}
        run: bash .github/scripts/merge-group-members.sh hold

  agent_review:
    # Must match the required check's name exactly; rulesets match by name.
    name: Agent review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: { fetch-depth: 0, persist-credentials: false }
      - name: Confirm every queued pull request was reviewed and passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE: ${{ github.event.merge_group.base_ref }}
          HEAD: ${{ github.event.merge_group.head_ref }}
        run: bash .github/scripts/merge-group-members.sh review
