services:
  squid-proxy:
    container_name: awf-squid
    networks:
      awf-net:
        ipv4_address: 172.30.0.10
      awf-ext: {}
    volumes:
      - /tmp/gh-aw/sandbox/firewall/logs:/var/log/squid:rw
    healthcheck:
      test:
        - CMD
        - nc
        - -z
        - localhost
        - '3128'
      interval: 2s
      timeout: 2s
      retries: 10
      start_period: 5s
    ports:
      - 3128:3128
    cap_drop:
      - NET_RAW
      - SYS_ADMIN
      - SYS_PTRACE
      - SYS_MODULE
      - MKNOD
      - AUDIT_WRITE
      - SETFCAP
    stop_grace_period: 2s
    user: '0:0'
    environment:
      AWF_SQUID_CONFIG_B64: '[REDACTED]'
    entrypoint:
      - /bin/bash
      - -c
      - chown proxy:proxy /var/log/squid 2>/dev/null || chmod 0777 /var/log/squid; for f in /var/log/squid/access.log /var/log/squid/audit.jsonl /var/log/squid/cache.log; do if [ -L "$$f" ] || [ -e "$$f" ]; then chown -h proxy:proxy "$$f" 2>/dev/null || true; fi; done; if [ -d /var/spool/squid_ssl_db ]; then chown proxy:proxy /var/spool/squid_ssl_db 2>/dev/null || chmod 0777 /var/spool/squid_ssl_db; fi && exec su -s /bin/bash proxy -c 'echo "$$AWF_SQUID_CONFIG_B64" | base64 -d > /etc/squid/squid.conf && if grep -Fq "cert=/var/run/squid/awf-sni-guard-cert.pem" /etc/squid/squid.conf; then echo "[squid-entrypoint] Generating ephemeral TLS SNI guard certificate"; umask 077; openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 1 -subj "/CN=awf-sni-guard.invalid" -keyout /var/run/squid/awf-sni-guard-key.pem -out /var/run/squid/awf-sni-guard-cert.pem >/dev/null 2>&1; fi && exec /usr/local/bin/entrypoint.sh'
    image: ghcr.io/github/gh-aw-firewall/squid:0.28.23@sha256:02ffc56dd40158223064ef03a78c2d9717473c93723b4e403d455ea6f0b09ae0
